[package]
name = "porchetta"
version = "0.3.0"
edition = "2024"
description = "Bidirectional dotfile manager backed by a bare Git store and three-way merge"
repository = "https://github.com/PurpleMyst/porchetta"
readme = "README.md"
license = "Apache-2.0"

[lints.clippy]
all = "warn"
perf = "warn"
pedantic = "warn"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
gix = { version = "0.88.0", features = ["merge", "anyhow"] }
hostname = "0.4.2"
log = "0.4.34"
mlua = { version = "0.12.2", features = ["anyhow", "lua54", "vendored", "serde"] }
serde_json = "1.0.151"
sha2 = "0.11"
tempfile = "3.27.0"
smallvec = "1.16.2"
inquire = "0.9.4"
flexi_logger = "0.31.10"
dirs = "7"
owo-colors = "4.4.0"
camino = "1.2.6"
